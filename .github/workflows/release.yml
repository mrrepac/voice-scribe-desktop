name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Publish installer and update metadata together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release create "v$version" "release/Voice-Scribe-Setup-$version-x64.exe" "release/Voice-Scribe-Setup-$version-x64.exe.blockmap" "release/latest.yml" --verify-tag --draft --title "Voice Scribe $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; it was not published' }
          gh release edit "v$version" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
