name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Dependencies run their install scripts here, so this job gets a read-only
  # token and keeps no git credentials on disk.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # GigaAM is bundled into the installer; fetched once per pinned revision.
      - uses: actions/cache@v6
        with:
          path: models
          key: gigaam-${{ hashFiles('src/shared/gigaam-model.json') }}
      - run: npm run dist
      - name: Collect release files
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path upload | Out-Null
          Copy-Item "release/Voice-Scribe-Setup-$version-x64.exe", "release/Voice-Scribe-Setup-$version-x64.exe.blockmap", "release/latest.yml" upload
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: upload
          if-no-files-found: error
          retention-days: 1

  # Each runner builds its own architecture: npm installs only the host's sherpa-onnx package.
  build-mac:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v6
        with:
          path: models
          key: gigaam-${{ hashFiles('src/shared/gigaam-model.json') }}
      - run: npm run dist:mac
      - name: Collect release files
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir upload
          cp "release/Voice-Scribe-$version-${{ matrix.arch }}.dmg" "release/Voice-Scribe-$version-${{ matrix.arch }}.zip" upload/
          # Unsigned builds only read the version from it, so one copy serves both architectures.
          if [ "${{ matrix.arch }}" = arm64 ]; then cp release/latest-mac.yml upload/; fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-mac-${{ matrix.arch }}
          path: upload
          if-no-files-found: error
          retention-days: 1

  # The only job that can write to the repository runs no project code.
  publish:
    needs: [build, build-mac]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release*
          path: upload
          merge-multiple: true
      - name: Publish installer and update metadata together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          gh release create "v$version" "upload/Voice-Scribe-Setup-$version-x64.exe" "upload/Voice-Scribe-Setup-$version-x64.exe.blockmap" "upload/latest.yml" "upload/Voice-Scribe-$version-arm64.dmg" "upload/Voice-Scribe-$version-arm64.zip" "upload/Voice-Scribe-$version-x64.dmg" "upload/Voice-Scribe-$version-x64.zip" "upload/latest-mac.yml" --verify-tag --draft --title "Voice Scribe $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; it was not published' }
          gh release edit "v$version" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
